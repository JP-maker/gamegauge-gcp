# ============================================================================
#  Configuration nginx pour l'essai GKE
#  À placer dans le dépôt gamegauge-ui-gcp, en remplacement de nginx.conf.
#
#  Différences avec la configuration de production sur le VPS :
#   - plus aucun bloc TLS : les certificats Let's Encrypt de /etc/letsencrypt
#     n'existent pas dans le cluster, et nginx refuserait de démarrer en les
#     cherchant. Le chiffrement, s'il est ajouté plus tard, se fait au niveau
#     de l'Ingress GCP, pas dans ce conteneur.
#   - plus de server_name gamegauge.fr : on répond sur l'IP du load balancer.
#   - plus de vhost analytics : Umami ne fait pas partie de l'essai.
#   - le proxy /api/ pointe vers le Service Kubernetes « backend », résolu par
#     le DNS interne du cluster (kube-dns).
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression : l'application Angular fait environ 1 Mo de JavaScript.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Routage côté client : toute URL inconnue renvoie index.html, c'est
    # Angular qui décide ensuite quoi afficher.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les fichiers compilés portent un hash dans leur nom : ils peuvent être
    # mis en cache indéfiniment.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Appels d'API : le frontend Angular interroge /api en relatif, nginx
    # relaie vers le backend. Tout se passe donc en même origine, ce qui
    # évite complètement la question du CORS.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Point de contrôle pour les sondes Kubernetes, sans passer par Angular.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
