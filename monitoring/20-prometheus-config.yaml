apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    # ======================================================================
    #  Quatre sources de métriques, et une manière différente de trouver
    #  chacune. C'est le cœur de ce qu'il y a à expliquer : Prometheus
    #  interroge l'API Kubernetes pour découvrir ses cibles au fil de l'eau,
    #  au lieu de travailler sur une liste figée.
    # ======================================================================
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: gamegauge-essai

    scrape_configs:

      # 1. Prometheus lui-même
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      # 2. Les kubelets : CPU et mémoire vus depuis chaque nœud.
      #    On passe par le proxy de l'API server plutôt que d'attaquer le
      #    port 10250 des nœuds, ce qui évite d'ouvrir quoi que ce soit.
      - job_name: kubernetes-nodes
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics

      # 3. cAdvisor, embarqué dans la kubelet : consommation par conteneur.
      #    C'est cette source qui alimente les graphiques « CPU par pod ».
      - job_name: kubernetes-cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

      # 4. Les pods qui se déclarent eux-mêmes, par annotation.
      #    Un pod portant prometheus.io/scrape: "true" est collecté
      #    automatiquement : c'est ainsi que le backend Spring Boot entre
      #    dans la supervision, sans toucher à cette configuration.
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod

      # 5. kube-state-metrics : l'état des objets Kubernetes eux-mêmes
      #    (combien de réplicas souhaités, combien disponibles, etc.)
      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics.monitoring.svc.cluster.local:8080"]
