# Copiez ce fichier en 01-secret.yaml, remplacez les valeurs, et NE VERSIONNEZ PAS
# le résultat (voir .gitignore).
#
# Générez la clé JWT ainsi :
#   openssl rand -base64 32
# jjwt signe en HS256 et refuse toute clé de moins de 256 bits une fois décodée,
# d'où les 32 octets.
#
# stringData accepte du texte clair : Kubernetes se charge de l'encodage base64.
apiVersion: v1
kind: Secret
metadata:
  name: gamegauge-secrets
  namespace: gamegauge
type: Opaque
stringData:
  DB_USER: gamegauge
  DB_PASSWORD: REMPLACEZ_MOI_mot_de_passe_applicatif
  DB_ROOT_PASSWORD: REMPLACEZ_MOI_mot_de_passe_root
  JWT_SECRET: REMPLACEZ_MOI_par_la_sortie_de_openssl_rand_base64_32
  # Clé factice : l'essai ne passe pas par la vérification reCAPTCHA réelle.
  RECAPTCHA_SECRET_KEY: cle-factice-essai-gke
