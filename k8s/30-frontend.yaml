# ============================================================================
#  Frontend Angular servi par nginx
#  Remplacez IMAGE_FRONTEND par « terraform output image_prefix » suivi de
#  /gamegauge-ui:essai
#
#  Le Service est de type LoadBalancer : GKE provisionne automatiquement un
#  équilibreur de charge réseau GCP et lui attribue une IP publique. C'est
#  cette IP que vous ouvrirez dans le navigateur.
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: gamegauge
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: gamegauge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: IMAGE_FRONTEND
          # Même raison que pour le backend : le tag « essai » étant réécrit
          # à chaque build, il faut forcer le téléchargement.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
